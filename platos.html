<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búfalo GOURMET - Menú y Platos</title>
<style>
:root{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#f4f4f4;background:#1a1a1a}
body{margin:0}
header{background:#8b0000;color:white;padding:20px;text-align:center;border-bottom:3px solid #d2691e}
header h1{margin:0;font-size:24px;text-transform:uppercase}
nav{background:#2a2a2a;padding:10px;text-align:center;border-bottom:1px solid #444}
nav a{color:#f39c12;text-decoration:none;margin:0 15px;font-weight:bold}
nav a:hover{text-decoration:underline}
main{max-width:1100px;margin:25px auto;padding:0 16px}
.panel{background:#2a2a2a;border-radius:10px;padding:24px;margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.4);border-left:5px solid #d2691e}
form{display:flex;gap:10px;flex-wrap:wrap}
input,textarea,select{padding:11px;border:1px solid #444;border-radius:5px;background:#1a1a1a;color:#fff;flex:1;min-width:200px}
textarea{resize:vertical;min-height:40px}
button{padding:10px 16px;background:#8b0000;border:0;border-radius:5px;color:white;cursor:pointer;font-weight:bold}
button:hover{background:#a93226}
.secundario{background:#555}
.csv-box{background:#333;padding:15px;border-radius:6px;margin-top:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:15px}
th{background:#333;color:#f39c12;text-align:left;padding:12px}
td{padding:12px;border-bottom:1px solid #444}
.disponible{color:#2ecc71;font-weight:bold}
.no-disponible{color:#e74c3c;font-weight:bold}
#mensaje{margin-top:10px;color:#f39c12;font-weight:bold}
</style>
</head>
<body>
<header>
    <img src="logo.png" alt="Búfalo Gourmet Logo" class="logo-img">
    <h1>Búfalo GOURMET</h1>
    <p>Gestión de Menú y Platos</p>
</header>
<nav>
    <a href="index.html">← Volver al Menú Principal</a>
</nav>

<main>
<section class="panel">
    <h2>Registrar / Importar Platos</h2>
    <form id="formulario">
        <input id="nombre" placeholder="Nombre del plato (ej. Tomahawk de Búfalo)" required>
        <input id="precio" type="number" step="0.01" placeholder="Precio ($)" required>
        <select id="disponible">
            <option value="true">Disponible</option>
            <option value="false">No disponible</option>
        </select>
        <textarea id="descripcion" placeholder="Descripción del corte o preparación"></textarea>
        <button type="submit">Guardar Plato</button>
        <button type="button" class="secundario" id="cancelarBtn">Limpiar</button>
    </form>

    <div class="csv-box">
        <span style="font-weight:bold;color:#f39c12;">Importar masivo (CSV):</span>
        <input type="file" id="csvFile" accept=".csv" style="background:#111;">
        <button type="button" id="importCsvBtn" style="background:#27ae60;">Subir CSV</button>
        <small style="color:#aaa;display:block;width:100%;">Formato esperado de columnas (con cabecera): <code>nombre,descripcion,precio,disponible</code> (disponible: true/false)</small>
    </div>
    <p id="mensaje"></p>
</section>

<section class="panel">
    <h2>Carta de Platos en Supabase</h2>
    <input id="buscar" placeholder="Buscar plato..." style="width:100%;margin-bottom:15px;box-sizing:border-box;">
    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>Plato</th>
                    <th>Descripción</th>
                    <th>Precio</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="listaPlatos"></tbody>
        </table>
    </div>
</section>
</main>

<script>
const SUPABASE_URL = "https://cuoyvtybvosxfpthcrbe.supabase.co"; 
const SUPABASE_KEY = "sb_publishable_X7_VB3rLXgT1U257tuLwtQ_SBNONS1F"; 

let platos = [];
const $ = id => document.getElementById(id);
const moneda = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n || 0);

function render() {
    const filtro = $('buscar').value.toLowerCase();
    const tbody = $('listaPlatos');
    tbody.replaceChildren();

    platos.filter(p => p.nombre.toLowerCase().includes(filtro)).forEach(p => {
        const tr = document.createElement('tr');
        
        const tdNombre = document.createElement('td');
        tdNombre.textContent = p.nombre;
        
        const tdDesc = document.createElement('td');
        tdDesc.textContent = p.descripcion || 'Sin descripción';
        
        const tdPrecio = document.createElement('td');
        tdPrecio.textContent = moneda(p.precio);
        
        const tdEst = document.createElement('td');
        const span = document.createElement('span');
        span.className = p.disponible ? 'disponible' : 'no-disponible';
        span.textContent = p.disponible ? 'DISPONIBLE' : 'AGOTADO';
        tdEst.append(span);

        tr.append(tdNombre, tdDesc, tdPrecio, tdEst);
        tbody.append(tr);
    });
}

async function cargarPlatos() {
    if (SUPABASE_URL.includes("TU_SUPABASE")) {
        $('mensaje').textContent = '⚠️ Configura tus credenciales de Supabase en el script del archivo.';
        return;
    }
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/platos?select=*&order=id.asc`, {
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
        });
        if (!res.ok) throw new Error('Error al conectar con Supabase');
        platos = await res.json();
        render();
        $('mensaje').textContent = 'Menú sincronizado con Supabase.';
    } catch (e) {
        $('mensaje').textContent = 'Error: ' + e.message;
    }
}

$('formulario').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nuevoPlato = {
        nombre: $('nombre').value.trim(),
        descripcion: $('descripcion').value.trim(),
        precio: parseFloat($('precio').value),
        disponible: $('disponible').value === 'true'
    };

    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/platos`, {
            method: 'POST',
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                Prefer: 'return=representation'
            },
            body: JSON.stringify(nuevoPlato)
        });
        if (!res.ok) throw new Error('No se pudo guardar el plato');
        $('formulario').reset();
        cargarPlatos();
        $('mensaje').textContent = '¡Plato registrado con éxito!';
    } catch (err) {
        $('mensaje').textContent = 'Error al guardar: ' + err.message;
    }
});

// Lógica de importación CSV para platos
$('importCsvBtn').addEventListener('click', () => {
    const fileInput = $('csvFile');
    if (!fileInput.files.length) {
        alert('Por favor selecciona un archivo CSV primero.');
        return;
    }
    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.onload = async function(e) {
        const text = e.target.result;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        if (lines.length < 2) {
            alert('El archivo CSV está vacío o no tiene registros.');
            return;
        }
        
        let exitosos = 0;
        $('mensaje').textContent = 'Importando platos desde CSV...';

        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split(',').map(c => c.trim());
            if (cols.length >= 4) {
                const plato = {
                    nombre: cols[0],
                    descripcion: cols[1],
                    precio: parseFloat(cols[2]) || 0,
                    disponible: cols[3].toLowerCase() === 'true'
                };
                try {
                    const res = await fetch(`${SUPABASE_URL}/rest/v1/platos`, {
                        method: 'POST',
                        headers: {
                            apikey: SUPABASE_KEY,
                            Authorization: `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json',
                            Prefer: 'return=representation'
                        },
                        body: JSON.stringify(plato)
                    });
                    if (res.ok) exitosos++;
                } catch (err) {
                    console.error('Error insertando fila:', err);
                }
            }
        }
        cargarPlatos();
        $('mensaje').textContent = `¡Importación completada! Se registraron ${exitosos} platos con éxito.`;
        fileInput.value = '';
    };
    reader.readAsText(file);
});

$('cancelarBtn').onclick = () => $('formulario').reset();
$('buscar').addEventListener('input', render);

cargarPlatos();
</script>
</body>
</html>
