<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búfalo GOURMET - Gestión de Personal</title>
<style>
:root{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#f4f4f4;background:#1a1a1a}
body{margin:0}
header{background:#8b0000;color:white;padding:20px;text-align:center;border-bottom:3px solid #d2691e}
header h1{margin:0;font-size:24px;text-transform:uppercase}
nav{background:#2a2a2a;padding:10px;text-align:center;border-bottom:1px solid #444}
nav a{color:#f39c12;text-decoration:none;margin:0 15px;font-weight:bold}
nav a:hover{text-decoration:underline}
main{max-width:1100px;margin:25px auto;padding:0 16px}
.panel{background:#2a2a2a;border-radius:10px;padding:24px;margin-bottom:20px;box-shadow:0 4px 8px rgba(0,0,0,0.4);border-left:5px solid #d2691e}
form{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:11px;border:1px solid #444;border-radius:5px;background:#1a1a1a;color:#fff;flex:1;min-width:180px}
button{padding:10px 16px;background:#8b0000;border:0;border-radius:5px;color:white;cursor:pointer;font-weight:bold}
button:hover{background:#a93226}
.secundario{background:#555}
.csv-box{background:#333;padding:15px;border-radius:6px;margin-top:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabla{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:15px}
th{background:#333;color:#f39c12;text-align:left;padding:12px}
td{padding:12px;border-bottom:1px solid #444}
.activo{color:#2ecc71;font-weight:bold}
.inactivo{color:#e74c3c;font-weight:bold}
#mensaje{margin-top:10px;font-weight:bold;padding:10px;border-radius:5px;}
.error{background:#512d2d;color:#ff8080;}
.exito{background:#2d5135;color:#80ff9f;}
</style>
</head>
<body>
<header>
    <img src="logo.png" alt="Búfalo Gourmet Logo" class="logo-img">
    <h1>Búfalo GOURMET</h1>
    <p>Módulo de Personal y Empleados</p>
</header>
<nav>
    <a href="index.html">← Volver al Menú Principal</a>
</nav>

<main>
<section class="panel">
    <h2>Registrar / Importar Empleados</h2>
    <form id="formulario">
        <input id="nombre" placeholder="Nombre completo" required>
        <select id="cargo" required>
            <option value="">Seleccione el cargo...</option>
            <option value="Mesero">Mesero</option>
            <option value="Cocinero">Cocinero</option>
            <option value="Administrador">Administrador</option>
            <option value="Parrillero">Parrillero</option>
        </select>
        <input id="telefono" placeholder="Teléfono de contacto">
        <button type="submit">Guardar Empleado</button>
        <button type="button" class="secundario" id="cancelarBtn">Limpiar</button>
    </form>

    <div class="csv-box">
        <span style="font-weight:bold;color:#f39c12;">Importar masivo (CSV):</span>
        <input type="file" id="csvFile" accept=".csv" style="background:#111;">
        <button type="button" id="importCsvBtn" style="background:#27ae60;">Subir CSV</button>
        <small style="color:#aaa;display:block;width:100%;">Formato esperado de columnas (con cabecera): <code>nombre,cargo,telefono</code></small>
    </div>
    <div id="mensaje"></div>
</section>

<section class="panel">
    <h2>Listado de Empleados en Supabase</h2>
    <input id="buscar" placeholder="Buscar empleado..." style="width:100%;margin-bottom:15px;box-sizing:border-box;">
    <div class="tabla">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Cargo</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="listaEmpleados"></tbody>
        </table>
    </div>
</section>
</main>

<script>
// CONFIGURACIÓN DE SUPABASE
const SUPABASE_URL = "https://cuoyvtybvosxfpthcrbe.supabase.co"; // Reemplaza con tu Project URL de Supabase
const SUPABASE_KEY = "sb_publishable_X7_VB3rLXgT1U257tuLwtQ_SBNONS1F"; // Reemplaza con tu API Key (anon / public)

let empleados = [];
const $ = id => document.getElementById(id);

function mostrarMensaje(texto, esError = false) {
    const msg = $('mensaje');
    msg.textContent = texto;
    msg.className = esError ? 'error' : 'exito';
}

function render() {
    const filtro = $('buscar').value.toLowerCase();
    const tbody = $('listaEmpleados');
    tbody.replaceChildren();

    empleados.filter(emp => emp.nombre.toLowerCase().includes(filtro) || emp.cargo.toLowerCase().includes(filtro)).forEach(emp => {
        const tr = document.createElement('tr');
        
        const tdId = document.createElement('td');
        tdId.textContent = emp.id;

        const tdNombre = document.createElement('td');
        tdNombre.textContent = emp.nombre;
        
        const tdCargo = document.createElement('td');
        tdCargo.textContent = emp.cargo;
        
        const tdTel = document.createElement('td');
        tdTel.textContent = emp.telefono || 'Sin teléfono';
        
        const tdEst = document.createElement('td');
        const span = document.createElement('span');
        const activo = emp.activo ?? true;
        span.className = activo ? 'activo' : 'inactivo';
        span.textContent = activo ? 'ACTIVO' : 'INACTIVO';
        tdEst.append(span);

        tr.append(tdId, tdNombre, tdCargo, tdTel, tdEst);
        tbody.append(tr);
    });
}

async function cargarEmpleados() {
    if (SUPABASE_URL.includes("TU_SUPABASE")) {
        mostrarMensaje('⚠️ Configura tus credenciales de Supabase en el script del archivo.', true);
        return;
    }
    try {
        const res = await fetch(`${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/empleados?select=*&order=id.asc`, {
            headers: { 
                apikey: SUPABASE_KEY, 
                Authorization: `Bearer ${SUPABASE_KEY}` 
            }
        });
        if (!res.ok) throw new Error('Error al conectar con Supabase: ' + res.statusText);
        empleados = await res.json();
        render();
        mostrarMensaje('Personal sincronizado correctamente con Supabase.');
    } catch (e) {
        mostrarMensaje('Error cargando empleados: ' + e.message, true);
    }
}

$('formulario').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const nuevoEmpleado = {
        nombre: $('nombre').value.trim(),
        cargo: $('cargo').value,
        telefono: $('telefono').value.trim(),
        activo: true
    };

    try {
        const res = await fetch(`${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/empleados`, {
            method: 'POST',
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            },
            body: JSON.stringify(nuevoEmpleado)
        });

        if (!res.ok) {
            const errorData = await res.text();
            throw new Error(`Error ${res.status}: ${errorData}`);
        }

        $('formulario').reset();
        await cargarEmpleados();
        mostrarMensaje('¡Empleado registrado con éxito en Supabase!');
    } catch (err) {
        mostrarMensaje('No se pudo guardar: ' + err.message, true);
        console.error(err);
    }
});

$('cancelarBtn').onclick = () => $('formulario').reset();
$('buscar').addEventListener('input', render);

// Inicializar
cargarEmpleados();
</script>
</body>
</html>
